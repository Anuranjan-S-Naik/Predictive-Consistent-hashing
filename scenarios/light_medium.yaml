# ============================================================================
# SCENARIO: Light-Medium Traffic
# ============================================================================
# Constant-rate traffic with a mix of Light and Medium requests (No Heavy).
# ============================================================================

scenario:
  name: "light_medium"
  description: "Mix of Light and Medium flows"
  version: "1.0"

traffic:
  rps: 150
  duration_seconds: 1800
  ramp_up_seconds: 2

  class_distribution:
    light: 0.40     # GET API calls, ~50 ms execution
    medium: 0.60    # DB queries, ~200 ms execution
    heavy: 0.00     # ML inference / batch ops, ~1000 ms execution

  pattern:
    type: "constant"
    jitter_pct: 5

  endpoints:
    - path: "/api/search"
      method: "GET"
      weight: 0.40
      avg_payload_bytes: 256
    - path: "/api/data"
      method: "POST"
      weight: 0.30
      avg_payload_bytes: 4096
    - path: "/api/status"
      method: "GET"
      weight: 0.30
      avg_payload_bytes: 128

  source_ids:
    count: 50
    prefix: "user_"
